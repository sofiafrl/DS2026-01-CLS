<!doctype html>
<html lang="pt-BR">
	<head>
		<meta charset="UTF-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1.0" />
		<title>Gerador Musical</title>
		<link rel="stylesheet" href="styles.css" />
	</head>
	<body>
		<main class="app-shell">
			<h1>Gerador Musical</h1>

			<section class="layout">
				<div class="left-column">
					<section class="card text-card" aria-labelledby="texto-title">
						<div class="card-header-row">
							<h2 id="texto-title">Texto</h2>
							<label class="file-button">
								Abrir TXT
								<input id="fileInput" type="file" accept=".txt,text/plain" />
							</label>
						</div>

						<div class="textarea-wrapper">
							<textarea id="textInput" maxlength="3000" placeholder="Digite ou cole seu texto aqui">
[0] C D E F
[4] G A B C</textarea
							>
							<span id="charCount">0 caract.</span>
						</div>

						<div class="text-actions">
							<button id="saveTextButton" class="secondary-button" type="button">Salvar TXT</button>
							<button id="exampleButton" class="secondary-button" type="button">
								Exemplo fuga
							</button>
						</div>
					</section>

					<section class="card config-card" aria-labelledby="config-title">
						<h2 id="config-title">Configurações</h2>

						<label class="control-row">
							<span>BPM</span>
							<input id="bpmInput" type="range" min="40" max="220" value="150" />
							<strong id="bpmValue">150</strong>
						</label>

						<label class="control-row">
							<span>Volume</span>
							<input id="volumeInput" type="range" min="1" max="127" value="100" />
							<strong id="volumeValue">100</strong>
						</label>

						<label class="control-row">
							<span>Oitava</span>
							<input id="octaveInput" type="range" min="0" max="9" value="6" />
							<strong id="octaveValue">6</strong>
						</label>

						<label class="control-row select-row">
							<span>Instrumento</span>
							<select id="instrumentInput"></select>
						</label>
					</section>
				</div>

				<div class="right-column">
					<section class="card player-card" aria-label="Controles de reprodução">
						<button id="playButton" class="primary-button" type="button">
							<span aria-hidden="true">▶</span> Play
						</button>
						<button id="pauseButton" class="primary-button" type="button">
							<span aria-hidden="true">■</span> Pause
						</button>
						<button id="restartButton" class="primary-button" type="button">Restart</button>
						<button id="downloadMidiButton" class="primary-button" type="button">
							Salvar MIDI
						</button>
					</section>

					<section class="card result-card" aria-labelledby="resultado-title">
						<h2 id="resultado-title">Eventos gerados</h2>
						<p class="hint">
							Cada linha do texto vira uma voz independente. Use <code>[4]</code> no início da linha
							para atrasar a entrada.
						</p>
						<div id="summary" class="summary">Nenhuma música gerada ainda.</div>
						<div id="eventsOutput" class="events-output"></div>
					</section>
				</div>
			</section>
		</main>

		<script src="app.js" type="module"></script>
	</body>
</html>
